apply plugin: 'maven-publish'
apply plugin: 'signing'

task androidSourcesJar(type: Jar) {
    classifier = 'sources'
    from android.sourceSets.main.java.source

    exclude "**/R.class"
    exclude "**/BuildConfig.class"
}

ext {
    PUBLISH_GROUP_ID = 'io.github.zzechao'
    PUBLISH_ARTIFACT_ID = 'canvasanimation'
}

File secretPropsFile = project.rootProject.file('local.properties')
if (secretPropsFile.exists()) {
    println "Found secret props file, loading props"
    Properties p = new Properties()
    p.load(new FileInputStream(secretPropsFile))
    p.each { name, value ->
        ext[name] = value
    }
} else {
    println "No props file, loading env vars"
}

def localReleaseDest = "${project.buildDir}/repo"

publishing {
    publications {
        release(MavenPublication) {
            groupId PUBLISH_GROUP_ID
            artifactId PUBLISH_ARTIFACT_ID
            version project.version

            artifact("$buildDir/outputs/aar/${project.getName()}-${project.version}.aar")
            artifact androidSourcesJar

            pom {
                name = PUBLISH_ARTIFACT_ID
                description = 'canvasAnimation上传aar插件至mavencentral，方便使用implementation快速引入'
                url = 'https://github.com/zzechao/CanvasAnimation'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'zhouzechao10'
                        name = 'zhouz'
                        email = 'zhouzechao10@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:github.com/zzechao/CanvasAnimation.git'
                    developerConnection = 'scm:git:ssh://github.com/zzechao/CanvasAnimation.git'
                    url = 'https://github.com/zzechao/CanvasAnimation/tree/master'
                }
                withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')

                    project.configurations.implementation.allDependencies.each {
                        def dependencyNode = dependenciesNode.appendNode('dependency')
                        dependencyNode.appendNode('groupId', it.group)
                        dependencyNode.appendNode('artifactId', it.name)
                        dependencyNode.appendNode('version', it.version)
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = "LocalBuild"
            url = localReleaseDest
        }
    }
}

signing {
    sign publishing.publications
}

task zipMavenArtifacts(type: Zip) {
    dependsOn publishReleasePublicationToLocalBuildRepository
    
    // The path where artifacts are published locally
    def groupPath = PUBLISH_GROUP_ID.replace('.', '/')
    def artifactPath = PUBLISH_ARTIFACT_ID
    def versionId = project.version
    
    from "${localReleaseDest}/${groupPath}/${artifactPath}/${versionId}"
    
    archiveFileName = "${PUBLISH_ARTIFACT_ID}-${versionId}-bundle.zip"
    destinationDirectory = file("${project.buildDir}/outputs/bundle")
    
    doLast {
        println "Maven bundle zip generated at: ${destinationDirectory.get()}/${archiveFileName.get()}"
    }
}
